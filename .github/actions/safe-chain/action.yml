name: Aikido Safe Chain
description: >
  Install Aikido Safe Chain (https://github.com/AikidoSec/safe-chain) so that
  every later npm, npx, pnpm, and pnpx command in the job checks each package
  against Aikido's malware list before it downloads it. Run it after
  pnpm/action-setup. Uses the documented CI install: a pinned release script
  with a fixed SHA-256; the script then checks the SHA-256 of the binary.
runs:
  using: composite
  steps:
    - name: Install Safe Chain
      shell: bash
      env:
        # Release 1.5.29 (2026-11-10). Update the version and the hash together.
        SAFE_CHAIN_RELEASE: 1.5.29
        SAFE_CHAIN_INSTALLER_SHA256: e9bfa05430bca0efcf26e5a0f06d09b9da8cc21de2e0ffab03f512dde649ebbe
      run: |
        set -euo pipefail
        installer="$RUNNER_TEMP/install-safe-chain.sh"
        curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_RELEASE}/install-safe-chain.sh" -o "$installer"
        echo "${SAFE_CHAIN_INSTALLER_SHA256}  $installer" | sha256sum -c -
        sh "$installer" --ci
        rm "$installer"
        # setup-ci (run by --ci) puts its shims first on PATH for the next steps.

    - name: Check that pnpm and npm go through Safe Chain
      shell: bash
      run: |
        set -euo pipefail
        for tool in pnpm npm; do
          path=$(command -v "$tool")
          echo "$tool: $path"
          case "$path" in
            "$HOME/.safe-chain/"*) ;;
            *) echo "::error::$tool does not go through Safe Chain ($path)"; exit 1 ;;
          esac
        done
