name: CDN hash check

# Tamper alarm (P-2538): every published version on cdn.manalens.dev must serve the
# exact dist/snippet.global.js of its @manalens/web npm tarball. The hash comes from the tarball,
# whose sha512 must equal the registry's dist.integrity. A failed run emails the
# repo admins. Before the first npm publish there is nothing to check.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Compare each published version with the CDN
        shell: bash
        run: |
          set -euo pipefail
          if ! VERSIONS=$(npm view @manalens/web versions --json 2>/dev/null); then
            echo "@manalens/web is not on npm yet. Nothing to check."
            exit 0
          fi
          for VERSION in $(node -p "[].concat(JSON.parse(process.argv[1])).join(' ')" "$VERSIONS"); do
            echo "::group::@manalens/web@$VERSION"
            packages/web/scripts/generate-sri.sh --version "$VERSION" --check-registry --check-cdn --attempts 3 --interval 20 >/dev/null
            echo "::endgroup::"
          done
          echo "All versions on cdn.manalens.dev match npm."
