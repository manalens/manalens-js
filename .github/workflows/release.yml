name: Publish Package

# Real publishes run only from a strict semver tag (vX.Y.Z) on main.
# workflow_dispatch is always a dry run: it builds, tests, packs, runs
# `npm publish --dry-run`, and hashes the packed tarball. Nothing is published.
# Adapted from getformo/sdk .github/workflows/release.yml.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EVENT: ${{ github.event_name }}
      TAG: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Validate tag format
        if: github.event_name == 'push'
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: '$TAG' is not a strict semver release tag"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main || {
            echo "Error: release tags must point to a commit on main"
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package version
        id: version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$EVENT" == "push" ]]; then
            test "${TAG#v}" = "$PACKAGE_VERSION" || {
              echo "Error: tag $TAG does not match package.json $PACKAGE_VERSION"
              exit 1
            }
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Typecheck, build and test
        run: |
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Pack and inspect publish contents
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --json --pack-destination "$RUNNER_TEMP/package" > "$RUNNER_TEMP/pack.json"
          PACK_JSON="$RUNNER_TEMP/pack.json" node <<'NODE'
          const fs = require('node:fs')
          const reports = JSON.parse(fs.readFileSync(process.env.PACK_JSON, 'utf8'))
          if (reports.length !== 1) throw new Error(`Expected one tarball, got ${reports.length}`)
          const files = reports[0].files.map(({ path }) => path)
          const forbidden = files.filter((path) => /(^|\/)(\.env|.*\.(pem|key|p12|pfx))$/i.test(path))
          if (forbidden.length) throw new Error(`Sensitive files in package: ${forbidden.join(', ')}`)
          for (const required of ['dist/index.js', 'dist/index.d.ts', 'dist/snippet.global.js']) {
            if (!files.includes(required)) throw new Error(`Missing ${required} in package`)
          }
          console.log(files.join('\n'))
          NODE

      - name: Upload immutable package candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  dry-run:
    name: Dry run (publish --dry-run and SRI of the packed tarball)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download package candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: npm publish --dry-run
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find "$PWD/package" -maxdepth 1 -name '*.tgz' -type f)
          test "${#TARBALLS[@]}" -eq 1 || { echo "Expected exactly one tarball"; exit 1; }
          npm publish "${TARBALLS[0]}" --dry-run --access public --provenance=false
          echo "tarball=${TARBALLS[0]}" >> "$GITHUB_ENV"

      - name: SRI of the packed snippet
        shell: bash
        run: |
          set -euo pipefail
          SNIPPET=$(scripts/generate-sri.sh --tarball "$tarball")
          {
            echo "## Dry run: snippet tag (not published)"
            echo
            echo '```html'
            echo "$SNIPPET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish approved tarball
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_NAME: '@untitled-analytics/web'
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download package candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install exact npm publishing client
        run: npm install --global npm@11.18.0

      - name: Verify tarball identity and lifecycle hooks
        run: |
          mapfile -t TARBALLS < <(find "$PWD/package" -maxdepth 1 -name '*.tgz' -type f)
          test "${#TARBALLS[@]}" -eq 1 || { echo "Expected exactly one tarball"; exit 1; }
          mkdir inspect
          tar -xzf "${TARBALLS[0]}" -C inspect
          PACKAGE_JSON=inspect/package/package.json node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync(process.env.PACKAGE_JSON, 'utf8'))
          if (pkg.name !== process.env.EXPECTED_NAME) throw new Error(`Unexpected package: ${pkg.name}`)
          if (pkg.version !== process.env.EXPECTED_VERSION) throw new Error(`Unexpected version: ${pkg.version}`)
          if (pkg.private) throw new Error('package.json is private')
          for (const hook of ['preinstall', 'install', 'postinstall']) {
            if (pkg.scripts?.[hook]) throw new Error(`Forbidden lifecycle hook: ${hook}`)
          }
          NODE
          test ! -f inspect/package/binding.gyp || { echo "Forbidden implicit install hook: binding.gyp"; exit 1; }
          echo "tarball=${TARBALLS[0]}" >> "$GITHUB_ENV"

      - name: Publish with provenance
        run: npm publish "$tarball" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create GitHub release with the CDN snippet
    if: github.event_name == 'push'
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download published tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # The hash comes from the tarball that was published, never from the
      # network. The script first proves the npm registry serves this exact
      # tarball (dist.integrity), then polls jsDelivr until it serves identical
      # bytes, and fails the job if either never matches. A CDN error body or an
      # empty body (sha384-OLBgp1Gs...) can never reach the release notes.
      - name: Compute SRI and wait for jsDelivr
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find "$PWD/package" -maxdepth 1 -name '*.tgz' -type f)
          test "${#TARBALLS[@]}" -eq 1 || { echo "Expected exactly one tarball"; exit 1; }
          scripts/generate-sri.sh --tarball "${TARBALLS[0]}" --version "$VERSION" \
            --check-registry --check-cdn --attempts 20 --interval 30 > snippet.html
          test -s snippet.html

      - name: Create release notes
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true

      - name: Add the snippet tag to the release notes
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > release-notes.md
          {
            echo
            echo "## Install (CDN)"
            echo
            echo "Replace the publishable key and endpoint with your own values."
            echo
            echo '```html'
            cat snippet.html
            echo '```'
            echo
            echo '```sh'
            echo "npm install @untitled-analytics/web@$VERSION"
            echo '```'
          } >> release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
