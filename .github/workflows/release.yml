name: Release

# Releases with Changesets (see RELEASING.md). Two packages: @manalens/web
# (packages/web) and @manalens/node (packages/node).
#
# - Push to main: keep the "Version packages" pull request up to date. It bumps
#   the versions and writes the changelogs from the files in .changeset/.
#   Nothing is published.
# - workflow_dispatch: build, test and pack each package whose version is not on
#   npm yet. With publish unchecked (the default) it is a dry run. With publish
#   checked, on main only, it publishes the packed tarballs with npm trusted
#   publishing (OIDC) and provenance, then creates the tag and the GitHub
#   release of each package (web-vX.Y.Z, node-vX.Y.Z). The web release waits
#   until cdn.manalens.dev serves the published snippet.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (unchecked = dry run)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-pr:
    name: Version packages pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # changesets/action pushes the "Version packages" branch with these
      # credentials. This job uploads no artifacts.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check packages with Aikido Safe Chain
        uses: ./.github/actions/safe-chain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create or update the pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          commit-message: Version packages
          pr-title: Version packages
        env:
          GITHUB_TOKEN: ${{ github.token }}

  plan:
    name: Find unpublished versions
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      any: ${{ steps.plan.outputs.any }}
    env:
      PUBLISH: ${{ inputs.publish }}
      REF: ${{ github.ref }}
    steps:
      - name: Only main can publish
        if: inputs.publish
        run: |
          test "$REF" = refs/heads/main || { echo "Error: publish only from main (got $REF)"; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: List the packages whose version is not on npm
        id: plan
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const packages = []
          for (const dir of ['web', 'node']) {
            const { name, version, private: isPrivate } = JSON.parse(fs.readFileSync(`packages/${dir}/package.json`, 'utf8'))
            if (isPrivate) throw new Error(`${name} is private`)
            let published = false
            try {
              published = execFileSync('npm', ['view', `${name}@${version}`, 'version'], { encoding: 'utf8' }).trim() === version
            } catch {}
            console.log(`${name}@${version}: ${published ? 'on npm, skip' : 'not on npm, release'}`)
            if (!published) packages.push({ dir, name, version })
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `packages=${JSON.stringify(packages)}\nany=${packages.length > 0}\n`)
          NODE

  build:
    name: Build, test and pack ${{ matrix.package.name }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      DIR: ${{ matrix.package.dir }}
      EXPECTED_NAME: ${{ matrix.package.name }}
      EXPECTED_VERSION: ${{ matrix.package.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check packages with Aikido Safe Chain
        uses: ./.github/actions/safe-chain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build and test (all packages)
        run: |
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Pack and inspect publish contents
        working-directory: packages/${{ matrix.package.dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/package" > "$RUNNER_TEMP/pack.json"
          PACK_JSON="$RUNNER_TEMP/pack.json" node <<'NODE'
          const fs = require('node:fs')
          const reports = JSON.parse(fs.readFileSync(process.env.PACK_JSON, 'utf8'))
          if (reports.length !== 1) throw new Error(`Expected one tarball, got ${reports.length}`)
          const { name, version } = reports[0]
          if (name !== process.env.EXPECTED_NAME || version !== process.env.EXPECTED_VERSION) throw new Error(`Packed ${name}@${version}`)
          const files = reports[0].files.map(({ path }) => path)
          const forbidden = files.filter((path) => /(^|\/)(\.env|.*\.(pem|key|p12|pfx))$/i.test(path))
          if (forbidden.length) throw new Error(`Sensitive files in package: ${forbidden.join(', ')}`)
          const required = {
            web: ['dist/index.js', 'dist/index.d.ts', 'dist/snippet.global.js', 'LICENSE'],
            node: ['dist/esm/index.js', 'dist/esm/index.d.ts', 'dist/cjs/index.js', 'dist/cjs/index.d.ts', 'dist/cjs/package.json', 'LICENSE'],
          }[process.env.DIR]
          for (const path of required) {
            if (!files.includes(path)) throw new Error(`Missing ${path} in package`)
          }
          console.log(files.join('\n'))
          NODE

      - name: Upload immutable package candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.package.dir }}
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  dry-run:
    name: Dry run ${{ matrix.package.name }}
    if: ${{ !inputs.publish }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download package candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-${{ matrix.package.dir }}
          path: package

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: npm publish --dry-run
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find "$PWD/package" -maxdepth 1 -name '*.tgz' -type f)
          test "${#TARBALLS[@]}" -eq 1 || { echo "Expected exactly one tarball"; exit 1; }
          npm publish "${TARBALLS[0]}" --dry-run --access public --provenance=false
          echo "tarball=${TARBALLS[0]}" >> "$GITHUB_ENV"

      - name: SRI of the packed snippet
        if: matrix.package.dir == 'web'
        shell: bash
        run: |
          set -euo pipefail
          SNIPPET=$(packages/web/scripts/generate-sri.sh --tarball "$tarball")
          {
            echo "## Dry run: snippet tag (not published)"
            echo
            echo '```html'
            echo "$SNIPPET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish ${{ matrix.package.name }}
    if: inputs.publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      EXPECTED_NAME: ${{ matrix.package.name }}
      EXPECTED_VERSION: ${{ matrix.package.version }}
    steps:
      - name: Download package candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-${{ matrix.package.dir }}
          path: package

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # npm 11.5.1 or later publishes with trusted publishing (OIDC).
      - name: Install exact npm publishing client
        run: npm install --global npm@11.18.0

      - name: Verify tarball identity and lifecycle hooks
        run: |
          mapfile -t TARBALLS < <(find "$PWD/package" -maxdepth 1 -name '*.tgz' -type f)
          test "${#TARBALLS[@]}" -eq 1 || { echo "Expected exactly one tarball"; exit 1; }
          mkdir inspect
          tar -xzf "${TARBALLS[0]}" -C inspect
          PACKAGE_JSON=inspect/package/package.json node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync(process.env.PACKAGE_JSON, 'utf8'))
          if (pkg.name !== process.env.EXPECTED_NAME) throw new Error(`Unexpected package: ${pkg.name}`)
          if (pkg.version !== process.env.EXPECTED_VERSION) throw new Error(`Unexpected version: ${pkg.version}`)
          if (pkg.private) throw new Error('package.json is private')
          for (const hook of ['preinstall', 'install', 'postinstall', 'prepare']) {
            if (pkg.scripts?.[hook]) throw new Error(`Forbidden lifecycle hook: ${hook}`)
          }
          NODE
          test ! -f inspect/package/binding.gyp || { echo "Forbidden implicit install hook: binding.gyp"; exit 1; }
          echo "tarball=${TARBALLS[0]}" >> "$GITHUB_ENV"

      # Trusted publishing only: npm exchanges the OIDC token of this job
      # (workflow release.yml, environment npm-publish) for a short-lived
      # publish token. No npm token is stored in GitHub. A new package gets
      # its trusted publisher after a one-time placeholder publish from a
      # maintainer's machine (RELEASING.md).
      - name: Publish with provenance
        run: npm publish "$tarball" --provenance --access public --registry https://registry.npmjs.org

  release:
    name: GitHub release of ${{ matrix.package.name }}
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      DIR: ${{ matrix.package.dir }}
      NAME: ${{ matrix.package.name }}
      VERSION: ${{ matrix.package.version }}
      TAG: ${{ matrix.package.dir }}-v${{ matrix.package.version }}
      COMMIT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download published tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-${{ matrix.package.dir }}
          path: package

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The hash comes from the tarball that was published, never from the
      # network. The script first proves the npm registry serves this exact
      # tarball (dist.integrity), then polls cdn.manalens.dev until it serves identical
      # bytes, and fails the job if either never matches. A CDN error body or an
      # empty body (sha384-OLBgp1Gs...) can never reach the release notes.
      - name: Compute SRI and wait for cdn.manalens.dev
        if: matrix.package.dir == 'web'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find "$PWD/package" -maxdepth 1 -name '*.tgz' -type f)
          test "${#TARBALLS[@]}" -eq 1 || { echo "Expected exactly one tarball"; exit 1; }
          packages/web/scripts/generate-sri.sh --tarball "${TARBALLS[0]}" --version "$VERSION" \
            --check-registry --check-cdn --attempts 20 --interval 30 > snippet.html
          test -s snippet.html

      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          # This version's section of the package changelog (written by Changesets).
          CHANGELOG="packages/$DIR/CHANGELOG.md" node > release-notes.md <<'NODE'
          const fs = require('node:fs')
          const file = process.env.CHANGELOG
          const text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : ''
          const start = text.indexOf(`## ${process.env.VERSION}\n`)
          if (start >= 0) {
            const next = text.indexOf('\n## ', start + 1)
            process.stdout.write(text.slice(text.indexOf('\n', start) + 1, next < 0 ? undefined : next).trim() + '\n')
          }
          NODE
          {
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "npm install $NAME@$VERSION"
            echo '```'
            if [[ "$DIR" == web ]]; then
              echo
              echo "## Install (CDN)"
              echo
              echo "Replace the publishable key and endpoint with your own values."
              echo
              echo '```html'
              cat snippet.html
              echo '```'
            fi
          } >> release-notes.md

      - name: Create the tag and the release
        run: gh release create "$TAG" --target "$COMMIT_SHA" --title "$NAME $VERSION" --notes-file release-notes.md
