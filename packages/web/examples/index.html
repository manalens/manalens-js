<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manalens SDK example</title><style>body{font:16px system-ui;max-width:700px;margin:60px auto;padding:0 20px;color:#17342c}button{padding:10px 16px;border:0;border-radius:8px;background:#b8ec3d;cursor:pointer}pre{background:#f2f6ee;padding:18px;border-radius:8px;overflow:auto}</style></head><body>
<h1>Manalens SDK example</h1><p>The pageview is sent on load. Click to send a custom event. Events are captured by the local example server.</p><button id="track">Track signup_completed</button><p><a href="/captured" target="_blank">View captured events</a></p><pre id="status">Ready</pre>
<script src="/snippet.global.js" data-publishable-key="mana_pk_example" data-endpoint="http://localhost:4317" defer></script>
<script defer>document.querySelector('#track').addEventListener('click', async () => { window.manalens.track('signup_completed', { plan: 'starter' }); await window.manalens.flush(); document.querySelector('#status').textContent = 'Event sent. Open captured events to inspect it.'; });</script>
</body></html>
